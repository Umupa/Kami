name: ci

# Manual only: macOS runners are billed by the minute. Every change is
# checked locally first, as AGENTS.md requires.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: check
        run: scripts/check.sh
      - name: build
        run: go tool mygo build -skip-dmg
