name: ci

# Manual only: macOS runners are billed by the minute. Every change is
# checked locally first, as AGENTS.md requires.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: mygo vet
        run: go tool mygo vet .
      - name: test
        run: go test ./...
      - name: build
        run: go tool mygo build -skip-dmg
