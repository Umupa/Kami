name: ci

# Manual only: every change is checked locally first, as AGENTS.md
# requires. Releases have a workflow of their own, release.yml.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: check
        run: scripts/check.sh
      - name: build
        run: go tool mygo build -skip-dmg -platform darwin/arm64,darwin/amd64
